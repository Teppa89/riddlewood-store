<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Riddlewood Pin Scheduler{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#faf9f7;--surface:#fff;--surface-alt:#f3f1ed;
  --fg:#1a1815;--fg-muted:#6b6560;--fg-light:#9e9890;
  --accent:#c8553d;--accent-hover:#b54a34;--accent-light:#fdf0ed;
  --border:#e8e5df;--border-strong:#d4d0c8;
  --green:#2d7a4f;--green-bg:#edf7f0;
  --red:#c8553d;--red-bg:#fdf0ed;
  --radius:10px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 12px rgba(0,0,0,.08);
}
body{
  font-family:'DM Sans',system-ui,-apple-system,sans-serif;
  background:var(--bg);color:var(--fg);
  line-height:1.5;-webkit-font-smoothing:antialiased;
}
a{color:var(--accent);text-decoration:none}
a:hover{color:var(--accent-hover)}

.container{max-width:1080px;margin:0 auto;padding:0 24px}

/* Nav */
nav{background:var(--surface);border-bottom:1px solid var(--border);padding:14px 0;position:sticky;top:0;z-index:10}
nav .inner{display:flex;align-items:center;justify-content:space-between;max-width:1080px;margin:0 auto;padding:0 24px}
nav .logo{font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--fg);display:flex;align-items:center;gap:10px}
nav .logo svg{width:28px;height:28px}
nav .nav-links{display:flex;gap:6px}
nav .nav-links a{
  padding:7px 14px;border-radius:8px;font-size:.875rem;
  font-weight:500;color:var(--fg-muted);transition:.15s
}
nav .nav-links a:hover,nav .nav-links a.active{background:var(--surface-alt);color:var(--fg)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;gap:8px;
  padding:10px 20px;border-radius:8px;font-size:.875rem;
  font-weight:600;border:none;cursor:pointer;transition:.15s;
  text-decoration:none;line-height:1.4
}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover);color:#fff}
.btn-outline{background:transparent;border:1.5px solid var(--border-strong);color:var(--fg)}
.btn-outline:hover{background:var(--surface-alt)}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8125rem}

/* Cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}

/* Stats */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin-bottom:32px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center}
.stat-card .number{font-family:'DM Serif Display',serif;font-size:2rem;color:var(--fg)}
.stat-card .label{font-size:.8125rem;color:var(--fg-muted);margin-top:2px}

/* Alert */
.alert{padding:14px 18px;border-radius:var(--radius);font-size:.875rem;margin-bottom:20px}
.alert-error{background:var(--red-bg);color:var(--red);border:1px solid #f5d5cf}
.alert-success{background:var(--green-bg);color:var(--green);border:1px solid #c8e6d0}

/* Section headers */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-header h2{font-family:'DM Serif Display',serif;font-size:1.375rem}

/* Pin grid */
.pin-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.pin-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);transition:.2s}
.pin-card:hover{box-shadow:var(--shadow-md);transform:translateY(-2px)}
.pin-card img{width:100%;height:180px;object-fit:cover}
.pin-card .pin-info{padding:12px}
.pin-card .pin-title{font-weight:600;font-size:.875rem;margin-bottom:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pin-card .pin-board{font-size:.75rem;color:var(--fg-muted)}

/* Form */
.form-group{margin-bottom:18px}
.form-group label{display:block;font-weight:600;font-size:.875rem;margin-bottom:6px;color:var(--fg)}
.form-group input,.form-group select,.form-group textarea{
  width:100%;padding:10px 14px;border:1.5px solid var(--border-strong);
  border-radius:8px;font-size:.875rem;font-family:inherit;
  background:var(--surface);color:var(--fg);transition:.15s
}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{
  outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-light)
}
.form-group textarea{resize:vertical;min-height:80px}
.form-group .help{font-size:.75rem;color:var(--fg-light);margin-top:4px}

/* Board list */
.board-item{display:flex;align-items:center;gap:16px;padding:16px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:10px;transition:.15s}
.board-item:hover{box-shadow:var(--shadow)}
.board-thumb{width:64px;height:64px;border-radius:8px;object-fit:cover;background:var(--surface-alt)}
.board-info h3{font-size:1rem;font-weight:600;margin-bottom:2px}
.board-info p{font-size:.8125rem;color:var(--fg-muted)}
.board-pins-count{margin-left:auto;font-family:'DM Serif Display',serif;font-size:1.25rem;color:var(--accent)}

/* Footer */
footer{text-align:center;padding:40px 24px;color:var(--fg-light);font-size:.8125rem}

/* Page header */
.page-header{padding:32px 0 24px;border-bottom:1px solid var(--border);margin-bottom:32px}
.page-header h1{font-family:'DM Serif Display',serif;font-size:1.75rem;margin-bottom:4px}
.page-header p{color:var(--fg-muted);font-size:.9375rem}

/* User badge */
.user-badge{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--surface-alt);border-radius:var(--radius);margin-bottom:24px}
.user-avatar{width:40px;height:40px;border-radius:50%;background:var(--accent-light);display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--accent);font-size:.875rem}
.user-info .name{font-weight:600;font-size:.9375rem}
.user-info .handle{font-size:.8125rem;color:var(--fg-muted)}

@media(max-width:640px){
  .stat-row{grid-template-columns:1fr 1fr}
  .pin-grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .card-grid{grid-template-columns:1fr}
  nav .nav-links a{padding:7px 10px;font-size:.8125rem}
}
</style>
</head>
<body>
{% block nav %}{% endblock %}
{% block content %}{% endblock %}
<footer>
  <div class="container">Riddlewood Pin Scheduler &middot; Pinterest API v5</div>
</footer>
</body>
</html>
